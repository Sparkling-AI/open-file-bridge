  </defs>

  <g clip-path="url(#sq)">
    <rect x="16" y="16" width="496" height="992" fill="url(#gl)"/>
    <rect x="512" y="16" width="496" height="992" fill="url(#gr)"/>
  </g>

  <!-- folder (files side) -->
